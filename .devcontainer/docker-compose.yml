services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # SELinux: :z = shared content label so Fedora (SELinux on) can mount the project folder
    volumes:
      - ..:/workspaces/shamela-bookstore:z
      - opencode-data:/home/vscode/.local/share/opencode
    env_file:
      - ../.env
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CI: "1"
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity

  postgres:
    image: postgres:16-bookworm
    env_file:
      - ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
  opencode-data:
